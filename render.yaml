services:
    - type: web
      name: zuzo-ai-backend
      runtime: go
      plan: free
      buildCommand: go build -o bin/api ./cmd/api
      startCommand: ./bin/api
      healthCheckPath: /api/health
      envVars:
          - key: GEMINI_API_KEY
            sync: false
          - key: GEMINI_MODEL
            value: gemini-3.5-flash-lite
          - key: CORS_ORIGIN
            value: https://zuzogp.com
          - key: SUPABASE_URL
            value: https://rcrlrwlgewzjtzqcewop.supabase.co
          - key: SUPABASE_SERVICE_ROLE_KEY
            sync: false
